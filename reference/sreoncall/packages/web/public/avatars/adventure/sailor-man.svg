  <!-- eyes -->
  <circle cx="52" cy="46" r="2.5" fill="#1E293B"/>
  <circle cx="68" cy="46" r="2.5" fill="#1E293B"/>
  <!-- beard -->
  <path d="M42 54 Q44 66 60 68 Q76 66 78 54" fill="#2D1B0E"/>
  <!-- smile in beard -->
