  <line x1="38" y1="86" x2="82" y2="86" stroke="#1E40AF" stroke-width="3"/>
  <line x1="38" y1="92" x2="82" y2="92" stroke="#1E40AF" stroke-width="3"/>
  <line x1="38" y1="98" x2="82" y2="98" stroke="#1E40AF" stroke-width="3"/>
  <!-- v-neck -->
