  <circle cx="60" cy="48" r="24" fill="#B8835A"/>
  <!-- hair in elegant bun -->
  <path d="M38 44 Q38 26 60 24 Q82 26 82 44 Q78 30 60 28 Q42 30 38 44Z" fill="#1A1A1A"/>
  <path d="M36 40 L36 50 Q36 44 40 40" fill="#1A1A1A"/>
  <path d="M84 40 L84 50 Q84 44 80 40" fill="#1A1A1A"/>
  <!-- bun -->
  <circle cx="60" cy="22" r="10" fill="#1A1A1A"/>
  <!-- hair flower -->
  <circle cx="72" cy="24" r="5" fill="#F472B6"/>
  <circle cx="72" cy="24" r="2" fill="#FBBF24"/>
  <!-- eyes -->
  <circle cx="52" cy="46" r="2.5" fill="#1E293B"/>
  <circle cx="68" cy="46" r="2.5" fill="#1E293B"/>
  <!-- eyelashes -->
  <line x1="48" y1="44" x2="50" y2="42" stroke="#1E293B" stroke-width="1"/>
  <line x1="64" y1="44" x2="66" y2="42" stroke="#1E293B" stroke-width="1"/>
  <!-- graceful smile -->
  <path d="M54 55 Q60 60 66 55" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- sparkles -->
  <path d="M90 36 L92 32 L94 36 L90 34 L94 34Z" fill="#FBBF24"/>
  <path d="M26 56 L28 52 L30 56 L26 54 L30 54Z" fill="#FBBF24"/>
