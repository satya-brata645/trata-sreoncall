  <path d="M42 88 Q42 74 60 70 Q78 74 78 88 L78 120 L42 120Z" fill="#EC4899"/>
  <!-- wrap detail -->
  <path d="M42 78 Q60 86 78 78" stroke="#DB2777" stroke-width="2" fill="none"/>
