<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <circle cx="60" cy="60" r="60" fill="#FFE4E6"/>
  <!-- smock/apron -->
  <path d="M38 88 Q38 74 60 70 Q82 74 82 88 L82 120 L38 120Z" fill="#7C3AED"/>
  <!-- paint splatters on smock -->
  <circle cx="50" cy="90" r="3" fill="#EF4444"/>
  <circle cx="66" cy="86" r="2.5" fill="#3B82F6"/>
  <circle cx="72" cy="94" r="2" fill="#FBBF24"/>
  <!-- neck -->
  <rect x="54" y="66" width="12" height="8" rx="3" fill="#8D6040"/>
  <!-- head -->
  <circle cx="60" cy="48" r="24" fill="#8D6040"/>
  <!-- big natural hair -->
  <circle cx="60" cy="34" r="28" fill="#1A1A1A"/>
  <circle cx="40" cy="40" r="12" fill="#1A1A1A"/>
  <circle cx="80" cy="40" r="12" fill="#1A1A1A"/>
  <!-- face cutout -->
  <circle cx="60" cy="48" r="22" fill="#8D6040"/>
  <!-- beret -->
  <path d="M42 32 Q42 22 60 20 Q78 22 82 32" fill="#EF4444"/>
  <ellipse cx="62" cy="32" rx="20" ry="4" fill="#DC2626"/>
  <circle cx="60" cy="20" r="3" fill="#DC2626"/>
  <!-- eyes -->
  <circle cx="52" cy="46" r="2.5" fill="#1E293B"/>
  <circle cx="68" cy="46" r="2.5" fill="#1E293B"/>
  <!-- smile -->
  <path d="M52 56 Q60 62 68 56" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- paintbrush -->
  <line x1="86" y1="68" x2="96" y2="56" stroke="#92400E" stroke-width="3" stroke-linecap="round"/>
  <path d="M96 56 L100 52 L98 50 L94 54Z" fill="#EF4444"/>
</svg>