  <line x1="60" y1="78" x2="60" y2="110" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="60" cy="84" r="1.5" fill="#CBD5E1"/>
  <circle cx="60" cy="92" r="1.5" fill="#CBD5E1"/>
  <!-- neck -->
  <rect x="54" y="66" width="12" height="8" rx="3" fill="#8D6040"/>
  <!-- head -->
  <circle cx="60" cy="48" r="24" fill="#8D6040"/>
  <!-- hair - curly updo -->
  <circle cx="46" cy="30" r="8" fill="#1A1A1A"/>
  <circle cx="60" cy="26" r="9" fill="#1A1A1A"/>
  <circle cx="74" cy="30" r="8" fill="#1A1A1A"/>
  <circle cx="40" cy="38" r="6" fill="#1A1A1A"/>
  <circle cx="80" cy="38" r="6" fill="#1A1A1A"/>
  <!-- safety goggles on head -->
  <path d="M42 30 Q42 26 50 26 L70 26 Q78 26 78 30" stroke="#22D3EE" stroke-width="3" fill="none"/>
  <circle cx="50" cy="30" r="5" stroke="#22D3EE" stroke-width="2" fill="#CFFAFE" fill-opacity="0.4"/>
  <circle cx="70" cy="30" r="5" stroke="#22D3EE" stroke-width="2" fill="#CFFAFE" fill-opacity="0.4"/>
  <!-- eyes -->
  <circle cx="52" cy="46" r="2.5" fill="#1E293B"/>
  <circle cx="68" cy="46" r="2.5" fill="#1E293B"/>
  <!-- smile -->
  <path d="M52 56 Q60 62 68 56" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- test tube -->
  <rect x="76" y="82" width="6" height="20" rx="3" fill="#22D3EE"/>
  <rect x="76" y="92" width="6" height="10" rx="3" fill="#A855F7"/>
