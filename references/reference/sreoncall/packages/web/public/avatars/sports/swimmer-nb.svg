  <circle cx="60" cy="48" r="24" fill="#E8B88A"/>
  <!-- swim cap -->
  <path d="M36 48 Q36 22 60 20 Q84 22 84 48 Q82 44 60 42 Q38 44 36 48Z" fill="#6366F1"/>
  <path d="M36 48 Q36 46 38 44" stroke="#6366F1" stroke-width="2"/>
  <path d="M84 48 Q84 46 82 44" stroke="#6366F1" stroke-width="2"/>
  <!-- goggles -->
  <ellipse cx="50" cy="46" rx="8" ry="6" stroke="#1E293B" stroke-width="2" fill="#38BDF8" fill-opacity="0.3"/>
  <ellipse cx="70" cy="46" rx="8" ry="6" stroke="#1E293B" stroke-width="2" fill="#38BDF8" fill-opacity="0.3"/>
  <line x1="58" y1="46" x2="62" y2="46" stroke="#1E293B" stroke-width="2"/>
  <!-- eyes behind goggles -->
  <circle cx="50" cy="46" r="2" fill="#1E293B"/>
