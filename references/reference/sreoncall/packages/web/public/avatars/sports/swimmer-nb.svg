  <!-- smile -->
  <path d="M52 56 Q60 62 68 56" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- water waves at bottom -->
  <path d="M20 108 Q30 102 40 108 Q50 114 60 108 Q70 102 80 108 Q90 114 100 108" stroke="#38BDF8" stroke-width="3" fill="none"/>
