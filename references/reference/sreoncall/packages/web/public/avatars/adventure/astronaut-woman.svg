<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <circle cx="60" cy="60" r="60" fill="#FFDAB9"/>
  <!-- space suit -->
  <path d="M34 88 Q34 72 60 68 Q86 72 86 88 L86 120 L34 120Z" fill="#E2E8F0"/>
  <!-- suit details -->
  <rect x="50" y="82" width="20" height="12" rx="2" fill="#94A3B8"/>
  <circle cx="56" cy="88" r="2" fill="#22C55E"/>
  <circle cx="64" cy="88" r="2" fill="#EF4444"/>
  <!-- neck ring -->
  <ellipse cx="60" cy="68" rx="16" ry="4" fill="#94A3B8"/>
  <!-- helmet -->
  <circle cx="60" cy="46" r="30" fill="#CBD5E1"/>
  <circle cx="60" cy="46" r="26" fill="#1E293B" fill-opacity="0.05"/>
  <!-- visor reflection -->
  <path d="M42 36 Q44 32 50 34" stroke="white" stroke-width="2" stroke-linecap="round" fill-opacity="0.3"/>
  <!-- face inside helmet -->
  <circle cx="60" cy="48" r="22" fill="#FDDCB5"/>
  <!-- hair -->
  <path d="M40 42 Q40 28 60 26 Q80 28 80 42 Q76 32 60 30 Q44 32 40 42Z" fill="#B45309"/>
  <path d="M38 40 L38 52 Q38 46 42 42" fill="#B45309"/>
  <path d="M82 40 L82 52 Q82 46 78 42" fill="#B45309"/>
  <!-- eyes -->
  <circle cx="52" cy="46" r="2.5" fill="#1E293B"/>
  <circle cx="68" cy="46" r="2.5" fill="#1E293B"/>
  <!-- smile -->
  <path d="M52 55 Q60 61 68 55" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- helmet rim -->
  <circle cx="60" cy="46" r="30" fill="none" stroke="#94A3B8" stroke-width="3"/>
</svg>